name: Build AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['app-v*']
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install frontend tooling
        run: npm install

      - name: JavaScript tests
        run: npm test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      - name: AppImage startup smoke test on Ubuntu 22.04
        shell: bash
        run: |
          chmod +x scripts/smoke-appimage.sh
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          scripts/smoke-appimage.sh "$appimage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: webOwie-Proxmox-Client-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  compatibility-ubuntu-24:
    needs: test-and-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop graphics runtime for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgles2

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: webOwie-Proxmox-Client-AppImage
          path: artifact

      - name: AppImage startup smoke test on Ubuntu 24.04
        shell: bash
        run: |
          chmod +x scripts/smoke-appimage.sh
          appimage="$(find artifact -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          scripts/smoke-appimage.sh "$appimage"

  publish-release:
    needs: [test-and-build, compatibility-ubuntu-24]
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download verified AppImage
        uses: actions/download-artifact@v4
        with:
          name: webOwie-Proxmox-Client-AppImage
          path: artifact

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifact/*.AppImage \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "webOwie Proxmox Client $GITHUB_REF_NAME"
